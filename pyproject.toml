[project]
name = "traderai"
version = "1.0.0"
description = "AI-powered personal trading intelligence platform — scoring engine, lead indicators, morning briefings, and a live dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "yfinance>=0.2.50",
    "pandas>=2.0",
    "numpy>=1.26",
    "requests>=2.31",
    "rich>=13.0",
    "tabulate>=0.9",
    "python-dotenv>=1.0",
    "ta>=0.11",
    "filelock>=3.12",
    "anthropic>=0.40",
    "earningscall>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]
